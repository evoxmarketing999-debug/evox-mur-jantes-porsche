<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mur Jantes Porsche — Studio EVOX</title>
<link rel="stylesheet" href="https://use.typekit.net/yqa3sik.css">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --papier: #E7E5E0; --encre: #1C1C1A; --titre: #5C5C58; --doux: #85847E; --filet: #BDBBB4; --vert: #CCFF00; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--papier); color: var(--encre); font-family: "Montserrat", sans-serif; min-height: 100svh; display: flex; flex-direction: column; padding: 32px clamp(16px, 5vw, 64px); }
  .large { font-family: "cofo-peshka-variable", sans-serif; text-transform: uppercase; font-variation-settings: "wght" 700, "wdth" 150; }
  .surtitre { font-size: 11px; letter-spacing: .28em; color: var(--doux); }
  .surtitre::before { content: ""; display: inline-block; width: 8px; height: 8px; background: var(--vert); margin-right: 10px; }
  h1 { margin-top: 12vh; font-size: clamp(26px, 6vw, 72px); line-height: 1; color: var(--titre); font-variation-settings: "wght" 560, "wdth" 150; }
  ul { list-style: none; margin-top: 48px; border-top: 1px solid var(--filet); max-width: 720px; }
  a { display: flex; justify-content: space-between; align-items: center; padding: 22px 0; border-bottom: 1px solid var(--filet); color: var(--encre); text-decoration: none; }
  a span { font-size: 18px; } a small { color: var(--doux); font-size: 13px; }
  a:hover span { text-decoration: underline; text-decoration-color: var(--vert); text-decoration-thickness: 3px; text-underline-offset: 6px; }
</style>
</head>
<body>
  <div class="surtitre large">Studio EVOX</div>
  <h1 class="large">Mur jantes Porsche</h1>
  <ul>
    <li><a href="v1/"><span class="large">Version 1</span><small>Repères stylistiques</small></a></li>
    <li><a href="v2/"><span class="large">Version 2</span><small>Avec l’histoire de chaque jante</small></a></li>
  </ul>
</body>
</html>
